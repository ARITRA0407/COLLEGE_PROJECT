<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edVance - College Recommendation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(45, 212, 191, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(251, 146, 60, 0.12), transparent 24%),
        linear-gradient(180deg, #f4f8fc 0%, #eef4f8 100%);
      color: #0f172a;
    }

    .page-wrap {
      width: 100%;
      max-width: 1440px;
      padding: 18px 18px 12px;
      margin: 0 auto;
    }

    /* Full-width sections (explore, top) — safe version, no vw trick */
    .explore-fullwidth {
      width: 100%;
      overflow-x: hidden;
    }

    .iframe-wrap {
      width: 100%;
      border-radius: 24px;
      margin-top: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.1);
    }

    .comparison-iframe {
      width: 100%;
      height: 0;
      border: 0;
      display: block;
      transition: height 0.2s ease;
    }

    /* Floating AI button */
    #aiBtn {
      position: fixed;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 60%, #fb923c 100%);
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #aiBtn:hover { filter: brightness(0.98); }

    @media (max-width: 768px) {
      .page-wrap { padding: 10px 10px 8px; }
      .iframe-wrap { border-radius: 16px; margin-top: 10px; }
      #aiBtn {
        width: 46px;
        height: 46px;
        font-size: 18px;
        left: 8px;
      }
    }

    @media (max-width: 480px) {
      #aiBtn {
        width: 40px;
        height: 40px;
        font-size: 16px;
        left: 6px;
      }
    }
  </style>
</head>

<body>

<div class="page-wrap">

  {% include 'partials/header.html' %}

  <div style="height:12px"></div>

  {% include 'partials/recommendation.html' %}

  <div style="height:18px"></div>

  <div class="iframe-wrap">
    <iframe
      id="comparisonIframe"
      class="comparison-iframe"
      src="{{ url_for('comparison') }}">
    </iframe>
  </div>

</div>

<div class="explore-fullwidth">
  {% include 'partials/explore.html' %}
  {% include 'partials/top.html' %}
</div>

{% include 'partials/ai.html' %}
{% include 'partials/about.html' %}

<button id="aiBtn" aria-label="Open AI Quiz">🧠</button>

<script>
  history.scrollRestoration = 'manual';
  window.addEventListener('load', () => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  });

  document.getElementById("aiBtn").onclick = function () {
    window.location.href = "/quiz";
  };

  const iframe = document.getElementById('comparisonIframe');

  function resizeIframe() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const h = doc.documentElement.scrollHeight || doc.body.scrollHeight;
      iframe.style.height = h + 'px';
    } catch (e) {}
  }

  iframe.addEventListener('load', function () {
    resizeIframe();
    let polls = 0;
    const iv = setInterval(() => {
      resizeIframe();
      if (++polls > 20) clearInterval(iv);
    }, 250);
  });

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'iframeHeight') {
      iframe.style.height = e.data.height + 'px';
    }
  });
</script>

</body>
</html>
