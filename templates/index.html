<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edVance - College Recommendation</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow-x: hidden; }

    body {
      font-family: Inter, system-ui;
      background: #f6f8fa;
      color: #1f2937;
    }

    .page-wrap { width: 100%; padding: 12px; margin: 0 auto; }

    .explore-fullwidth {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
    }

    .iframe-wrap {
      width: 100%;
      background: #fff;
      border-radius: 10px;
      margin-top: 18px;
    }

    .comparison-iframe {
      width: 100%;
      height: 800px;
      border: 0;
    }

    /* ✅ FLOATING BUTTON */
    #aiBtn {
      position: fixed;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    #aiBtn:hover {
      background: #059669;
    }
  </style>
</head>

<body>

<div class="page-wrap">

  {% include 'partials/header.html' %}

  <div style="height:12px"></div>

  {% include 'partials/recommendation.html' %}

  <div style="height:18px"></div>

  <div class="iframe-wrap">
    <iframe
      id="comparisonIframe"
      class="comparison-iframe"
      src="{{ url_for('comparison') }}">
    </iframe>
  </div>

</div>

<div class="explore-fullwidth">
  {% include 'partials/explore.html' %}
  {% include 'partials/top.html' %}
</div>

{% include 'partials/ai.html' %}
{% include 'partials/about.html' %}

<!-- ✅ FLOATING BUTTON -->
<button id="aiBtn">🧠</button>

<script>
  document.getElementById("aiBtn").onclick = function () {
    window.location.href = "/quiz";  // ✅ opens your quiz app
  };
</script>

</body>
</html>
