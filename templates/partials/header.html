<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edvance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/header.css') }}"
    />
  </head>
  <body class="bg-gray-100">

    <!-- Header Section -->
    <header class="main-header">

      <!-- Logo -->
      <div class="logo-container">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="edVance Logo"
          class="logo-img"
        />
        <a href="/" class="website-name">edVance</a>
      </div>

      <!-- ✅ Hamburger button (visible on mobile only, controlled by CSS) -->
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Nav -->
      <nav class="main-nav">
        <div class="nav-item dropdown">
          <span class="nav-link dropdown-toggle">Service</span>
          <div class="dropdown-menu">
            <a href="{{ url_for('comparison') }}" class="dropdown-item">College Comparison</a>
            <a href="{{ url_for('explore_colleges') }}" class="dropdown-item">Explore College</a>
            <a href="{{ url_for('top_ranked_colleges') }}" class="dropdown-item">Top Ranked Colleges</a>
          </div>
        </div>

        <div class="nav-item dropdown">
          <span class="nav-link dropdown-toggle">Counselling</span>
          <div class="dropdown-menu">
            <a href="{{ url_for('recommendation_page') }}" class="dropdown-item">Recommendation</a>
            <a href="{{ url_for('ai_guidance') }}" class="dropdown-item">AI Guidance</a>
          </div>
        </div>
      </nav>

      <!-- Auth buttons -->
      <div class="auth-buttons">
        {% if logged_in %}
          <span class="welcome-text">Welcome, {{ username.split('@')[0] }}</span>
          <a href="{{ url_for('logout') }}" class="auth-btn logout-btn">Logout</a>
        {% else %}
          <button class="auth-btn login-btn">Login</button>
          <button class="auth-btn signup-btn">Sign Up</button>
        {% endif %}
      </div>

    </header>

    <!-- Main Content -->
    <main class="main-content">
      <img
        src="{{ url_for('static', filename='images/body.png') }}"
        alt="Edvance campus hero"
      />
    </main>

    <!-- Auth Modal -->
    {% if not logged_in %}
    <div id="auth-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Access edVance</h2>
        <button class="google-auth-btn">
          <img
            src="{{ url_for('static', filename='images/google-icon.png') }}"
            alt="Google Icon"
            class="google-icon"
          />
          Continue with Google
        </button>
        <div class="separator">OR</div>
        <form id="auth-form">
          <input type="text"     id="auth-username" placeholder="Username/Email" required />
          <input type="password" id="auth-password" placeholder="Password"       required />
          <button type="submit"  id="auth-submit-btn" class="auth-submit-btn">Login</button>
          <p class="toggle-auth">
            New user? <span id="toggle-to-signup">Sign Up</span>
          </p>
        </form>
      </div>
    </div>
    {% endif %}

    <script src="{{ url_for('static', filename='js/header.js') }}"></script>

    <!-- ✅ Hamburger toggle script -->
    <script>
    (function () {
      const btn = document.getElementById('hamburger');
      if (!btn) return;
      const nav  = document.querySelector('.main-nav');
      const auth = document.querySelector('.auth-buttons');

      btn.addEventListener('click', function () {
        const open = btn.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        nav  && nav.classList.toggle('open', open);
        auth && auth.classList.toggle('open', open);
      });

      // Close drawer when any nav link is tapped
      document.querySelectorAll('.nav-link, .dropdown-item, .auth-btn, .logout-btn').forEach(function (el) {
        el.addEventListener('click', function () {
          btn.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
          nav  && nav.classList.remove('open');
          auth && auth.classList.remove('open');
        });
      });
    })();
    </script>

  </body>
</html>
