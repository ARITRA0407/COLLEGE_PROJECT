<!DOCTYPE html>
<html>
<head>
<title>Adaptive Quiz</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial;
    display: flex;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    overflow: hidden;
}

/* ================= WRAPPER ================= */
.wrapper {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* ================= LEFT ================= */
.left {
    width: 68%;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* ================= RIGHT ================= */
.right {
    width: 32%;
    padding: 15px;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(10px);
    overflow: hidden;
}

/* ================= CARDS ================= */
.card {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 12px;
}

/* ================= TITLE ================= */
h2 {
    margin: 0;
    font-size: 18px;
}

/* ================= TOP FLOW ================= */
.flow {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

/* ================= TIMER ================= */
#timer {
    font-size: 14px;
    text-align: right;
}

/* ================= DIFFICULTY ================= */
#difficulty {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

/* ================= QUESTION ================= */
#quiz {
    font-size: 15px;
}

/* ================= OPTIONS ================= */
button.opt {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    background: white;
    color: #1e3c72;
}

button.opt:hover {
    background: #e0e0e0;
}

/* ================= PROGRESS ================= */
.progress {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #00ffcc;
}

/* ================= AI HINT ================= */
#aiHint {
    font-size: 13px;
    color: #ddd;
}

/* ================= STREAK (FIXED) ================= */
#streak {
    font-size: 14px;
    font-weight: bold;
}

/* ================= CONFIDENCE ================= */
input[type="range"] {
    width: 100%;
}

/* ================= RIGHT PANEL IMPROVED ================= */
.right h3 {
    font-size: 18px;
    margin: 5px 0;
}

.category-box {
    display: grid;
    grid-template-columns: 1fr;
    gap: 5px;
    font-size: 20px;   /* 🔥 increased */
}

.cat {
    background: rgba(255,255,255,0.12);
    padding: 6px;
    border-radius: 6px;
    font-size: 13px;   /* 🔥 increased readability */
}

/* ================= NO SCROLL ================= */
.left, .right {
    overflow: hidden;
}
</style>

</head>

<body>

<div class="wrapper">

<!-- ================= LEFT ================= -->
<div class="left">

    <div class="card">
        <h2>Adaptive AI Quiz</h2>

        <div id="timer">⏱ Time: 0.0s</div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="difficulty">Difficulty: MEDIUM</div>
    </div>

    <div class="card" id="quiz"></div>

    <div class="card">
        <div id="aiHint"></div>
    </div>

    <!-- 🔥 FIXED STREAK (NO DUPLICATE TEXT) -->
    <div class="card" id="streak">🔥 Streak: 0</div>

    <div class="card">
        <label>Confidence: <span id="confValue">50%</span></label>
        <input type="range" min="0" max="100" value="50"
               oninput="updateConfidence(this.value)">
    </div>

    <button onclick="stopQuiz()">Stop Quiz</button>

</div>

<!-- ================= RIGHT ================= -->
<div class="right">

    <div class="card">
        <div class="flow">
            <div id="currentCategory">Current: -</div>
        </div>
    </div>

    <div class="card">
        <h3>Skill Analytics</h3>
        <div id="skillsBox" class="category-box"></div>
    </div>

</div>

</div>

<script src="/static/js/quiz.js" defer></script>

</body>
</html>
