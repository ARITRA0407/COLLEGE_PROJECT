<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adaptive Quiz</title>
        <style>
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  min-height: 100vh;
}


.wrapper {
  display: flex;
  width: 100%;
  min-height: 100vh;
}


.left {
  flex: 1 1 65%;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}


.right {
  flex: 0 0 32%;
  max-width: 340px;
  padding: 16px;
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(10px);
  overflow-y: auto;
}


.card {
  background: rgba(255,255,255,0.1);
  padding: 12px;
  border-radius: 12px;
}

h2 { margin: 0; font-size: 18px; }

.flow {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  flex-wrap: wrap;
  gap: 4px;
}

#timer { font-size: 14px; text-align: right; }
#difficulty { text-align: center; font-size: 14px; font-weight: bold; }

#quiz { font-size: 15px; }

button.opt {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  background: white;
  color: #1e3c72;
  transition: background 0.2s;
}
button.opt:hover { background: #e0e0e0; }

.progress {
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: #00ffcc;
  transition: width 0.3s ease;
}

#aiHint { font-size: 13px; color: #ddd; }
#streak { font-size: 14px; font-weight: bold; }

input[type="range"] { width: 100%; cursor: pointer; }

.right h3 { font-size: 17px; margin: 5px 0; }

.category-box {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
}
.cat {
  background: rgba(255,255,255,0.12);
  padding: 6px;
  border-radius: 6px;
  font-size: 13px;
}

button#stopBtn {
  background: rgba(255,255,255,0.15);
  color: white;
  border: 2px solid rgba(255,255,255,0.3);
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: background 0.2s;
}
button#stopBtn:hover { background: rgba(255,255,255,0.25); }

.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 15, 33, 0.74);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}

.loading-overlay.active {
  display: flex;
}

.loading-card {
  width: min(420px, 100%);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 18px;
  padding: 22px 20px;
  text-align: center;
  backdrop-filter: blur(14px);
}

.loading-card h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.loading-card p {
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.86);
}

.loading-spinner {
  width: 42px;
  height: 42px;
  margin: 0 auto 14px;
  border-radius: 50%;
  border: 4px solid rgba(255,255,255,0.22);
  border-top-color: #00ffcc;
  animation: quizSpin 0.9s linear infinite;
}

@keyframes quizSpin {
  to { transform: rotate(360deg); }
}


@media (max-width: 768px) {
  .wrapper { flex-direction: column; min-height: auto; }
  .left { flex: 1 1 auto; padding: 12px; }
  .right {
    flex: none;
    max-width: 100%;
    width: 100%;
    padding: 12px;
    backdrop-filter: none;
    background: rgba(0,0,0,0.2);
  }
  h2 { font-size: 16px; }
  button.opt { font-size: 13px; padding: 9px; }
}


@media (max-width: 480px) {
  .left, .right { padding: 10px; }
  h2 { font-size: 15px; }
  #quiz { font-size: 14px; }
  button.opt { font-size: 13px; }
  .category-box { grid-template-columns: 1fr 1fr; }
}
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="left">
                <div class="card">
                    <h2>Adaptive AI Quiz</h2>
                    <div id="timer">⏱ Time: 0.0s</div>
                    <div class="progress">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div id="difficulty">Difficulty: MEDIUM</div>
                </div>
                <div class="card" id="quiz"></div>
                <div class="card">
                    <div id="aiHint"></div>
                </div>
                <div class="card" id="streak">🔥 Streak: 0</div>
                <div class="card">
                    <label>
                        Confidence: <span id="confValue">50%</span>
                    </label>
                    <input type="range"
                           min="0"
                           max="100"
                           value="50"
                           oninput="updateConfidence(this.value)">
                </div>
                <button id="stopBtn" onclick="stopQuiz()">Stop Quiz</button>
            </div>
            <div class="right">
                <div class="card">
                    <div class="flow">
                        <div id="currentCategory">Current: -</div>
                    </div>
                </div>
                <div class="card">
                    <h3>Skill Analytics</h3>
                    <div id="skillsBox" class="category-box"></div>
                </div>
            </div>
        </div>
        <div id="loadingOverlay"
             class="loading-overlay"
             aria-live="polite"
             aria-hidden="true">
            <div class="loading-card">
                <div class="loading-spinner"></div>
                <h3>Preparing your result</h3>
                <p>The timer is stopped. Opening the result page now.</p>
            </div>
        </div>
        <script src="/static/js/quiz.js" defer></script>
    </body>
</html>
